name: ptm

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${PTM_DB_USER:-myuser}
      POSTGRES_PASSWORD: ${PTM_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
