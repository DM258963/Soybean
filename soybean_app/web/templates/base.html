<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN-PTM Viewer V1.0 - {{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_url(request, 'css/variables.css') }}">
    <link rel="stylesheet" href="{{ static_url(request, 'css/layout.css') }}?v=20261016b">
    <link rel="stylesheet" href="{{ static_url(request, 'css/components.css') }}?v=20261016d">
    {% if agent_runtime_enabled %}
    <link rel="stylesheet" href="{{ static_url(request, 'css/agent_chat.css') }}?v=20261019g">
    {% endif %}
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "components/navbar.html" %}

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ static_url(request, 'js/navigation.js') }}?v=20261016a"></script>
    <script src="{{ static_url(request, 'js/loading_feedback.js') }}?v=20261016a"></script>
    {% if agent_runtime_enabled %}
    <script src="{{ static_url(request, 'js/agent_chat.js') }}?v=20261019d"></script>
    {% endif %}
    {% block extra_js %}{% endblock %}
</body>
</html>
